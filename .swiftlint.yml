# SwiftLint configuration for SwiftVaporUI.
# Runs automatically through the SwiftLint build tool plugin on every build.
# The plugin passes its own file list, so `included` is mostly for CLI runs.

included:
  - Sources
  - Tests
  - Examples/DemoServer/Sources

excluded:
  - "**/.build"
  - .swiftpm

disabled_rules:
  # Trailing commas are this codebase's style for multi-line literals.
  - trailing_comma

opt_in_rules:
  - closure_spacing
  - empty_count
  - first_where
  - missing_docs
  - modifier_order
  - sorted_imports
  - toggle_bool

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
  ignores_multiline_strings: true

identifier_name:
  # `_render(into:)` is the DSL's underscored internal hook, as in SwiftUI.
  allowed_symbols: ["_"]
  min_length: 1
  max_length: 50

type_name:
  max_length: 50

file_length:
  warning: 1000
  error: 1500

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 80
  error: 150

# House style: every type, property and function carries a `///` doc
# comment, whatever its access level. Extensions themselves are exempt.
missing_docs:
  warning: [open, public, internal, fileprivate, private]
  excludes_trivial_init: true

# House style also puts a blank line after a type's opening brace, before
# its closing brace, between documented members and around each MARK.
# SwiftLint has no built-in rule that requires those blank lines, so the
# custom rules below enforce them, and `vertical_whitespace_opening_braces`
# and `vertical_whitespace_closing_braces` (which forbid them) stay off. The
# default `vertical_whitespace` rule keeps each gap to a single blank line.
#
# A "type" is any struct, class, enum, protocol, actor or extension whose
# declaration ends with `{` on the same line.
custom_rules:
  type_opening_brace_blank_line:
    name: "Blank Line After Type Opening Brace"
    regex: '^[ \t]*(?:(?:@[\w.]+(?:\([^)\n]*\))?|public|package|internal|private|fileprivate|open|final|indirect|nonisolated)[ \t]+)*(?:struct|class|enum|protocol|actor|extension)[ \t]+[A-Z_][^\n]*\{[ \t]*(?://[^\n]*)?\n(?=[ \t]*[^\s}])'
    message: "Put a blank line after a type's opening brace."
    severity: warning
  type_closing_brace_blank_line:
    name: "Blank Line Before Type Closing Brace"
    regex: '^([ \t]*)(?:(?:@[\w.]+(?:\([^)\n]*\))?|public|package|internal|private|fileprivate|open|final|indirect|nonisolated)[ \t]+)*(?:struct|class|enum|protocol|actor|extension)[ \t]+[A-Z_][^\n]*\{[ \t]*(?://[^\n]*)?\n(?:(?!\1\}[ \t]*(?://[^\n]*)?$)[^\n]*\n)*(?<=[^\s{]\n)\1\}'
    message: "Put a blank line before the closing brace of the type declared here."
    severity: warning
  doc_comment_blank_line_before:
    name: "Blank Line Before Doc Comment"
    regex: '(?<=^[ \t]{0,40}[^\s/{#](?:[^\n]{0,400}[^\s{])?\n)[ \t]*///'
    message: "Put a blank line between a declaration and the next doc comment."
    severity: warning
  doc_comment_no_gap:
    name: "Doc Comment Directly Above Declaration"
    regex: '^[ \t]*///[^\n]*\n(?=[ \t]*\n)'
    message: "A doc comment sits directly above its declaration, with no blank line between them."
    severity: warning
  mark_blank_line_before:
    name: "Blank Line Before MARK"
    regex: '(?<=^[ \t]{0,40}\S[^\n]{0,400}\n)[ \t]*// MARK:'
    message: "Put a blank line before each MARK."
    severity: warning
  mark_blank_line_after:
    name: "Blank Line After MARK"
    regex: '^[ \t]*// MARK:[^\n]*\n(?=[ \t]*\S)'
    message: "Put a blank line after each MARK."
    severity: warning
